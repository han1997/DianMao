<!-- ===== left: studio / chapters ===== -->
<aside class="studio">
  <a class="brand" href="#" data-page="home"><span class="brand-mark">D</span>DianMao <span class="edition">Design preview</span></a>
  <div class="studio-copy">
    <span class="proposal">界面提案 / 01</span>
    <h1>时间是指南针,<br>不是清单。</h1>
    <p>一个温暖安静的个人任务指挥台。<br>四象限决定方向,时间决定什么时候看它。</p>
  </div>
  <nav class="chapter-nav" id="chapterNav" aria-label="页面导航"></nav>
  <div class="studio-bottom">
    <div class="swatches"><i></i><i></i><i></i><i></i></div>
    <p>The Day Compass<br>暖纸 / 陶土 / 日历蓝</p>
    <small>所有任务、统计与同步状态均为演示。<br>不连接日历,不发送通知,不读写本地数据。</small>
  </div>
</aside>

<!-- ===== center: phone stage ===== -->
<main class="stage">
  <header class="stage-top">
    <span><i class="live-dot"></i> 可交互预览 <span class="muted">/ 直接点手机里的控件试试</span></span>
    <button class="text-button" id="themeToggle" aria-label="切换明暗主题"></button>
  </header>
  <div class="phone" id="phone">
    <div class="statusbar"><b>9:41</b><span class="camera"></span><span>5G <svg class="icon s16"><use href="#i-wifi"/></svg><svg class="icon s16"><use href="#i-battery"/></svg></span></div>
    <div class="app-shell">
      <header id="appHeader" class="app-header"></header>
      <div id="content" class="content" tabindex="-1"></div>
    </div>
    <button class="fab" id="fab" data-action="add" aria-label="新增事项"><svg class="icon s24"><use href="#i-add"/></svg></button>
    <div id="toast" class="toast" role="status"></div>
    <div class="overlay" id="overlay" hidden>
      <div class="overlay-scrim" data-action="close"></div>
      <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-heading"><span class="sheet-icon" id="sheetIcon"></span><h2 id="sheetTitle"></h2><button class="icon-button" data-action="close" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button></div>
        <div id="sheetBody"></div>
      </div>
    </div>
    <div class="home-indicator"></div>
  </div>
  <footer class="stage-caption"><span id="pageCaption">首页</span><span>DianMao / Concept 01</span></footer>
</main>

<!-- ===== right: design notes ===== -->
<aside class="notes">
  <div class="note-number" id="noteNumber">01</div>
  <h2 id="noteTitle">先捕捉,<br>再分类。</h2>
  <p id="noteBody">快速记录先于整理。四象限不是分类表单,而是一眼看清今天该往哪走。</p>
  <div class="note-line"></div>
  <h3>试着操作</h3>
  <ul id="noteList"></ul>
</aside>
